<ng-container *ngIf="isEditable; else normalGrid">

  <div class="grid-container mat-elevation-z2">

    <!-- <mat-form-field appearance="outline" class="full-width">
      <mat-label>Search</mat-label>
      <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilter()" />
    </mat-form-field> -->

    <table mat-table [dataSource]="filteredData" class="mat-table-responsive">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">
          <input matInput [(ngModel)]="row.id" />
        </td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">
          <input matInput [(ngModel)]="row.name" />
        </td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">
          <input matInput [(ngModel)]="row.email" />
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="warn" (click)="deleteRow(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>

    </table>

    <button mat-raised-button color="primary" (click)="addRow()">
      Add Row
    </button>

  </div>

</ng-container>

<ng-template #normalGrid>

  <div class="grid-container mat-elevation-z2">
    <table mat-table [dataSource]="data">
      <ng-container *ngFor="let col of columns; let i = index">
        <ng-container [matColumnDef]="col.key">
          <th mat-header-cell *matHeaderCellDef>{{ col.label }}</th>
          <td mat-cell *matCellDef="let row">{{ row[col.key] }}</td>
        </ng-container>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>

  </div>

</ng-template>
